[package]
name = "liquid-ytm"
version = "0.1.0"
description = "Lightweight audiophile YouTube Music desktop client in Rust with Liquid Glass UI"
authors = ["anesbo"]
edition = "2021"

[lib]
name = "liquid_ytm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
window-vibrancy = "0.8"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli", "stream"] }
rusqlite = { version = "0.35", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
sha1 = "0.10"
hex = "0.4"
url = "2"
uuid = { version = "1", features = ["v4"] }
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }

# Pure-Rust Audiophile Audio & DSP Engine
symphonia = { version = "0.6.1", features = ["all"] }
symphonia-opus = "0.1.3"
cpal = "0.15"
biquad = "0.4"
rubato = "0.16"
ringbuf = "0.4"
lofty = "0.22"
souvlaki = "0.8"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
